# Configuration of Hugo
# Guide: https://docs.hugoblox.com/tutorial/
# Hugo Documentation: https://gohugo.io/getting-started/configuration/#all-configuration-settings
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Website name (set in params.yaml under hugoblox.branding.name)
title: ''
# Website URL
baseURL: 'https://sichen-wang.github.io/'

############################
## LANGUAGE
############################

defaultContentLanguage: en
hasCJKLanguage: true
defaultContentLanguageInSubdir: false
removePathAccents: true

############################
## PAGE OPTIONS
############################

cascade:
  - _target:
      path: /slides/**
      kind: page
    outputs: [HTML, present]

############################
## ADVANCED
############################

build:
  writeStats: true
# 页面底部的 "Last updated" 取真实修改时间，而不是 front matter 里的 date
# （论文页的 date 是 poster 当天，用于顶部与列表卡片显示，不代表最后修改时间）。
# 优先级：git 提交时间 → front matter 的 lastmod → 文件修改时间 → date
enableGitInfo: true
# 回落链里**不能有** :fileModTime。CI 里 Hugo 对大部分文件取不到 git 信息
# （fetch-depth: 0 已设，原因未查明），一旦回落到文件修改时间，那就是 CI 检出
# 文件的时刻 —— 结果是每次重新构建都把上百个页面的「Last updated」刷成当天，
# 实测一篇 3 月的博文线上显示成 8 月 10 日。
# 落到 date（文章自己的日期）虽然不反映后续修改，但至少不会撒谎，也不会每次
# 构建都变。这同时让 sitemap 的 lastmod 恢复可用（scripts/indexnow.py 依赖它
# 判断哪些页面真的改过）。
frontmatter:
  lastmod: [':git', 'lastmod', 'date']
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles: [".ipynb_checkpoints$", "\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
disableAliases: false
# llms.txt：给 AI 抓取器的站点索引（llmstxt.org 约定）。用输出格式生成而不是
# 在 static/ 放死文件，这样新增博文/论文后内容自动跟随，不会写完就过期。
# params.yaml 里的 hugoblox.seo.ai 段在本主题版本没有对应模板，是空转的。
outputFormats:
  llms:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true

outputs:
  home: [HTML, RSS, headers, redirects, backlinks, llms]
  section: [HTML, RSS]
imaging:
  resampleFilter: lanczos
  quality: 90
  anchor: smart
  hint: picture
timeout: 600000
taxonomies:
  author: authors
  tag: tags
  publication_type: publication_types
markup:
  _merge: deep
  goldmark:
    extensions:
      extras:
        subscript:
          enable: false
        superscript:
          enable: false
  highlight:
    guessSyntax: true
    lineNos: false
security:
  _merge: deep
sitemap:
  _merge: deep
