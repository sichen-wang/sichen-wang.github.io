name: Build

env:
  NODE_VERSION: '20'

on:
  # Standalone trigger for PR validation
  pull_request:
    branches: ['main']
  # Reusable workflow trigger - called by deploy.yml
  workflow_call:
    outputs:
      artifact-id:
        description: 'The ID of the uploaded artifact'
        value: ${{ jobs.build.outputs.artifact-id }}
  # Allow manual trigger for testing
  workflow_dispatch:

# Read-only permissions for security
permissions:
  contents: read

# Prevent duplicate builds for the same PR
concurrency:
  group: build-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # Fetch history for Hugo's .GitInfo and .Lastmod
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Setup pnpm
      if: hashFiles('package.json') != ''
      uses: pnpm/action-setup@v4

    - name: Get Hugo Version
      id: hugo-version
      run: |
        # Install pinned yq version for robust YAML parsing
        YQ_VERSION="v4.44.1"
        if ! wget -q --tries=3 --waitretry=1 -O /tmp/yq \
          "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"; then
          echo "::error::Failed to download yq"
          exit 1
        fi
        sudo mv /tmp/yq /usr/local/bin/yq
        sudo chmod +x /usr/local/bin/yq
        
        # Read hugo_version from hugoblox.yaml
        VERSION=$(yq '.hugo_version // ""' hugoblox.yaml 2>/dev/null | grep -v '^null$' || true)
        
        # Fallback to a known stable version if not specified
        DEFAULT_VERSION="0.154.5"
        VERSION=${VERSION:-$DEFAULT_VERSION}
        
        # Validate version format (basic check)
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::warning::Invalid hugo_version format '$VERSION', using default $DEFAULT_VERSION"
          VERSION="$DEFAULT_VERSION"
        fi
        
        echo "HUGO_VERSION=$VERSION" >> $GITHUB_ENV
        echo "Using Hugo version: $VERSION"

    - name: Install dependencies
      run: |
        # Install Tailwind CLI if package.json exists
        if [ -f "package.json" ]; then
          echo "Installing Tailwind dependencies..."
          pnpm install --no-frozen-lockfile || npm install
        fi

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: ${{ env.HUGO_VERSION }}
        extended: true

    # Cache dependencies (Go modules, node_modules) - stable, rarely changes
    - uses: actions/cache@v4
      with:
        path: |
          /tmp/hugo_cache_runner/
          node_modules/
          modules/*/node_modules/
        key: ${{ runner.os }}-hugo-deps-${{ hashFiles('**/go.mod', '**/package-lock.json',
          '**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-hugo-deps-

    # Cache Hugo resources (processed images, CSS) - invalidates only when assets/config change
    - uses: actions/cache@v4
      with:
        path: resources/
        key: ${{ runner.os }}-hugo-resources-${{ hashFiles('assets/**/*', 'config/**/*',
          'hugo.yaml', 'package.json') }}
        restore-keys: |
          ${{ runner.os }}-hugo-resources-

    - name: Build with Hugo
      env:
        HUGO_ENVIRONMENT: production
        HUGO_BLOX_LICENSE: ${{ secrets.HUGO_BLOX_LICENSE }}
      run: |
        echo "Hugo Cache Dir: $(hugo config | grep cachedir)"
        hugo --minify

    - name: Generate Pagefind search index (if applicable)
      run: |
        set -euo pipefail
        if [ ! -f "package.json" ] || ! grep -q "pagefind" package.json; then
          echo "站点未使用 Pagefind，跳过。"
          exit 0
        fi

        # 必须用 extended 版：中文分词器只在它里面。标准版建出来的中文索引
        # entry 里 "wasm" 为 null，等于空壳 —— 实测搜任何中文词都是 0 命中。
        # npm 的 pagefind 包只放 .sha256，二进制靠 postinstall 下载，装到哪个
        # 版本不确定；这里直接取官方 release 的 extended 二进制，消除不确定性。
        # 体积 54 MB vs 标准版 9 MB，差的就是各语言的分词 WASM。
        PF_VERSION="v1.4.0"
        PF_TARBALL="pagefind_extended-${PF_VERSION}-x86_64-unknown-linux-musl.tar.gz"
        PF_URL="https://github.com/pagefind/pagefind/releases/download/${PF_VERSION}/${PF_TARBALL}"

        echo "下载 ${PF_TARBALL}"
        # --fail 不能省：没有它时 404 会被当成正常响应，把错误页面存成 tar 包，
        # 直到后面 tar 解包才报错，错误信息会指向完全无关的地方
        curl -sSL --fail --retry 3 --retry-delay 5 -o /tmp/pagefind.tar.gz "$PF_URL"

        # 校验：npm 的平台包里带着官方 sha256，用它核对下载内容。
        # 注意在 bin/ 子目录下，不在包根目录。
        SHA_FILE="node_modules/@pagefind/linux-x64/bin/${PF_TARBALL}.sha256"
        if [ -f "$SHA_FILE" ]; then
          EXPECT=$(cut -d' ' -f1 < "$SHA_FILE")
          ACTUAL=$(sha256sum /tmp/pagefind.tar.gz | cut -d' ' -f1)
          if [ "$EXPECT" != "$ACTUAL" ]; then
            echo "::error::pagefind_extended 校验和不符（期望 $EXPECT，实际 $ACTUAL）"
            exit 1
          fi
          echo "校验和通过"
        else
          echo "::warning::未找到官方 sha256（$SHA_FILE），跳过校验"
        fi

        tar -xzf /tmp/pagefind.tar.gz -C /tmp
        chmod +x /tmp/pagefind_extended
        /tmp/pagefind_extended --version
        # --force-language zh：全站单索引。分语言 + mergeIndex 实测有本质缺陷 ——
        # Pagefind 合并副索引时 load_wasm:false，查询词永远由主语言 wasm 处理，
        # 从英文页搜中文必然 0 命中（反向则丢词干还原）。统一进 zh 索引后，
        # jieba 正确切中文（实测「贪心」6 命中），英文单词照样成 token 可原词
        # 匹配；唯一代价是英文失去词干还原（strategies 搜不到 strategy）。
        /tmp/pagefind_extended --site public --force-language zh

        # 验收：zh 索引必须存在且覆盖全部博文。
        # 注意**不能**检查 wasm 字段 —— 运行时源码是
        #   let lang_wasm = index.wasm ? index.wasm : "unknown"
        # 即 null 只是「无专用词干器，回落通用 wasm」。英文标 en-us 是因为有
        # 词干器（strategies→strategy），中文没有词干化概念，extended 版建出的
        # zh 索引 wasm 照样是 null。上一次构建就是被这个错误断言拦死的。
        # 「确实在用 extended」由上面的显式下载 + sha256 校验保证，无需运行时再证。
        python3 - <<'PY'
        import json, sys
        d = json.load(open("public/pagefind/pagefind-entry.json"))
        langs = d.get("languages", {})
        print("索引语言:", {k: {"wasm": v.get("wasm"), "pages": v.get("page_count")} for k, v in langs.items()})
        zh = langs.get("zh", {})
        if zh.get("page_count", 0) < 50:
            print(f"::error::zh 索引缺失或页面过少（{zh.get('page_count', 0)}，博客有 70+ 篇）——语言标注可能没生效")
            sys.exit(1)
        PY

    - name: Upload artifact
      id: upload
      uses: actions/upload-pages-artifact@v4
      with:
        path: ./public
