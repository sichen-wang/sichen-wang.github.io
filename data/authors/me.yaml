bio: |
  I am Sichen Wang, an undergraduate student in Electronic and Computer Engineering at Shenzhen MSU-BIT University. With over 8 years of experience in competitive programming, I have achieved significant recognition in high-level algorithmic contests, including Gold Medals in the ICPC Asia Regional Contests and the China Collegiate Programming Contest.

  Now I am a Research Assistant at The Chinese University of Hong Kong, Shenzhen. My research interests lie at the intersection of Computer Science and Computational Mathematics, with a focus on Programming, Theoretical Computer Science, and Machine Learning Theory. I am dedicated to solving complex computational problems and exploring the mathematical foundations of learning algorithms.

