bio: |
  I am Sichen Wang, an undergraduate in Electronic and Computer Engineering at Shenzhen MSU-BIT University, currently a Research Assistant at The Chinese University of Hong Kong, Shenzhen. My research interests are Theoretical Computer Science, Algorithm Design and Analysis, and Statistical Learning Theory. My work spans quite a few areas, but the core question I care about has always been the same: how the complexity of a problem should be characterized, and what quantity ultimately determines it. I like to solve a problem completely: prove a lower bound, add the matching upper bound, and ideally an algorithm that attains it, closing the loop. Starting in seventh grade, I spent eight years in competitive programming and won gold medals at the ICPC Asia Regional Contests. I then turned to research, and my first paper, on noisy evolution strategies, appeared at ICML 2026. These days I am looking for remote or summer research opportunities in the United States, as well as PhD openings. Outside research, I play piano, violin, and drums, and enjoy badminton. Feel free to email me, whether to talk research or set up a game.

